<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Profiles</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar" id="topbar">
  <div class="topbar-in">
    <div class="search">
      <div class="search-field" id="field">
        <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Search profiles" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search profiles" tabindex="-1">
        <button class="clear" id="clear" type="button" aria-label="Clear search">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Search" aria-expanded="false" aria-controls="field">
        <svg class="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <svg class="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <div class="divider" aria-hidden="true">
      <b></b><span></span><em></em><span></span><b></b>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </header>

  <main>
    <ul class="list" id="list"></ul>
    <div id="status"></div>
    <div id="sentinel"></div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
