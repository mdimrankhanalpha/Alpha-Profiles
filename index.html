<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Alpha Profiles">
<title>Alpha Profiles</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <a class="wordmark" href="./" aria-label="Alpha Profiles home">Alpha Profiles</a>
  <button class="search-toggle" id="searchToggle" type="button" aria-label="Open search" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.2 4.2"></path></svg>
  </button>
</header>
<form class="search-panel" id="searchPanel" role="search" hidden>
  <label class="visually-hidden" for="searchInput">Search profiles</label>
  <input id="searchInput" type="search" placeholder="Search profiles..." autocomplete="off">
  <button id="clearSearch" type="button" aria-label="Clear search" hidden>×</button>
</form>
<main>
  <div id="profileList" class="profile-list" aria-live="polite"><div class="loading">Loading profiles…</div></div>
  <div id="emptyState" class="message" hidden>No profiles found.</div>
  <div id="errorState" class="message" hidden>Couldn't load profiles. Check that Profiles.txt is published beside this page.</div>
</main>
<script src="script.js" defer></script>
</body>
</html>
